# docker-compose.yml — продакшен-запуск: приложение + PostgreSQL.
#
# Порядок старта (важен):
#   postgres  → db-setup (накатывает структуру один раз) → app
#
# Структура базы накатывается отдельным одноразовым сервисом, а не на каждом
# старте приложения: `prisma db push` — идемпотентен, но не должен замедлять
# перезапуск и мешать двум репликам. Для настоящих миграций см. docs/deploy.md.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loginex}
      POSTGRES_USER: ${POSTGRES_USER:-loginex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loginex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-setup:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-loginex}:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/${POSTGRES_DB:-loginex}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET required}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:postgres:push"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-loginex}:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/${POSTGRES_DB:-loginex}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET required}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      TRAFFIC_PROVIDER: ${TRAFFIC_PROVIDER:-}
      YANDEX_ROUTING_API_KEY: ${YANDEX_ROUTING_API_KEY:-}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # фото и сканы документов — вне public, живут в data/uploads
      - loginex-uploads:/app/data/uploads
      - loginex-backups:/app/backups

  # pgAdmin — только для отладки: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@loginex.ru}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  pgdata:
  loginex-uploads:
  loginex-backups:
