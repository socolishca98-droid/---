# .github/workflows/ci.yml — CI: типы, тесты, сборка, образ, безопасность
name: CI/CD

on:
  push:
    branches: [main, "arena/*"]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # postinstall запускаает prisma generate — без него типы Prisma отсутствуют
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # tests/*.test.mjs (node:test) + __tests__/** (vitest)
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:safe
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    env:
      # контекст secrets недоступен в step-level `if`, поэтому поднимаем его в env джобы
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          # пушим только если в репозитории заданы креды Docker Hub
          push: ${{ env.DOCKERHUB_USERNAME != '' }}
          tags: loginex-tms:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: npm audit (high и выше — падаем)
        run: npm audit --audit-level=high
      - name: Секреты не должны быть в коде и в git
        run: |
          set -e
          # 1) захардкоженные значения секретов в исходниках
          if grep -rnE "(AUTH_SECRET|CRON_SECRET|ATI_TOKEN|DATABASE_URL)[\"']?\s*[:=]\s*[\"'][A-Za-z0-9+/=_-]{20,}[\"']" \
               --include="*.ts" --include="*.tsx" --include="*.mjs" --include="*.js" app lib scripts; then
            echo "::error::Найдены захардкоженные секреты в исходниках"
            exit 1
          fi
          # 2) файлы, которые никогда не должны попадать в репозиторий
          tracked=$(git ls-files | grep -E "^\.env$|^\.env\.local$|^prisma/dev\.db|^certificates/" || true)
          if [ -n "$tracked" ]; then
            echo "::error::В git отслеживаются приватные файлы: $tracked"
            exit 1
          fi
          echo "Секретов в исходниках и приватных файлов в git не найдено"
