# Nginx перед OSRM: публикуем маршрутизатор наружу, но с лимитами.
#
# Зачем вообще наружу: приложение работает на Vercel, сервер OSRM — на своей
# машине, между ними публичный интерфейс. Без лимитов один цикл расчёта по
# большому пулу (или чужой скрипт) займёт все ядра, и планировщик «повиснет»
# ровно в тот момент, когда логист нажал кнопку.

limit_req_zone $binary_remote_addr zone=osrm_zone:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=osrm_conn:10m;

server {
    listen 443 ssl http2;
    server_name osrm.loginex.example;   # ← свой домен

    ssl_certificate     /etc/letsencrypt/live/osrm.loginex.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osrm.loginex.example/privkey.pem;

    # Только маршрутизация и таблицы: остальные методы сервиса приложению не
    # нужны, а лишняя поверхность — лишний риск.
    location ~ ^/(route|table|nearest)/v1/ {
        limit_req zone=osrm_zone burst=40 nodelay;
        limit_conn osrm_conn 8;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        return 403;
    }
}
